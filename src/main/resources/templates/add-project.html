<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Add New Project</h2>

    <form action="/add-project"
          method="post"
          enctype="multipart/form-data">

        <div class="mb-3">
            <label>Title</label>
            <input type="text"
                   name="title"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea name="description"
                      class="form-control"
                      rows="4"></textarea>
        </div>

        <div class="mb-3">
            <label>Tech Stack</label>
            <input type="text"
                   name="techStack"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Github Link</label>
            <input type="text"
                   name="githubLink"
                   class="form-control">
        </div>
        <div class="mb-3">

            <label>Project Image</label>

            <input type="file"
                   name="image"
                   class="form-control">

        </div>

        <button class="btn btn-success">
            Save Project
        </button>

    </form>

</div>

</body>
</html>
