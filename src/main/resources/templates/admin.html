<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#121212;
            color:white;
        }

        .dashboard-card{
            background:#1e1e1e;
            border:none;
            border-radius:15px;
            transition:0.3s;
            color:white;
        }

        .dashboard-card:hover{
            transform:translateY(-5px);
        }

        .count{
            font-size:3rem;
            font-weight:bold;
        }

        .dashboard-title{
            font-weight:bold;
            margin-bottom:40px;
        }

    </style>

</head>
<body>

<div class="container mt-5">

    <h1 class="text-center dashboard-title">
        Admin Dashboard
    </h1>

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card dashboard-card shadow p-4 text-center">

                <h3>Total Projects</h3>

                <div class="count"
                     th:text="${projectCount}">
                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card dashboard-card shadow p-4 text-center">

                <h3>Total Messages</h3>

                <div class="count"
                     th:text="${messageCount}">
                </div>

            </div>

        </div>

    </div>

    <div class="row mt-5 g-3">

        <div class="col-md-4">

            <a href="/projects"
               class="btn btn-primary w-100">

                Manage Projects

            </a>

        </div>

        <div class="col-md-4">

            <a href="/messages"
               class="btn btn-success w-100">

                View Messages

            </a>

        </div>

        <div class="col-md-4">

            <form action="/logout"
                  method="post">

                <button class="btn btn-danger w-100">

                    Logout

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
