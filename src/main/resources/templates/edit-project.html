<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Edit Project</h2>

    <form action="/update-project"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden"
               name="id"
               th:value="${project.id}">

        <div class="mb-3">
            <label>Title</label>

            <input type="text"
                   name="title"
                   class="form-control"
                   th:value="${project.title}">
        </div>

        <div class="mb-3">
            <label>Description</label>

            <textarea name="description"
                      class="form-control"
                      rows="4"
                      th:text="${project.description}">
            </textarea>
        </div>

        <div class="mb-3">
            <label>Tech Stack</label>

            <input type="text"
                   name="techStack"
                   class="form-control"
                   th:value="${project.techStack}">
        </div>
        <div class="mb-3">

            <label>Current Image</label>

            <br>

            <img th:src="@{'/uploads/' + ${project.imageName}}"
                 width="150">

        </div>
        <div class="mb-3">

            <label>Change Image</label>

            <input type="file"
                   name="image"
                   class="form-control">

        </div>

        <div class="mb-3">
            <label>Github Link</label>

            <input type="text"
                   name="githubLink"
                   class="form-control"
                   th:value="${project.githubLink}">
        </div>

        <button type="submit"
                class="btn btn-primary">

            Update Project

        </button>

    </form>

</div>

</body>
</html>
