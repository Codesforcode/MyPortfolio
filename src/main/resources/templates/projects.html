<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>All Projects</h2>

        <a href="/add-project"
           class="btn btn-success">
            Add Project
        </a>
    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Tech Stack</th>
            <th>Github</th>
            <th>Image</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="project : ${projects}">

            <td th:text="${project.id}"></td>

            <td th:text="${project.title}"></td>

            <td th:text="${project.description}"></td>

            <td th:text="${project.techStack}"></td>

            <td>
                <a th:href="${project.githubLink}"
                   target="_blank">
                    GitHub
                </a>
            </td>
            <td>

                <img th:src="@{'/uploads/' + ${project.imageName}}"
                     width="100"
                     height="70">

            </td>

            <td>

                <a th:href="@{/edit-project/{id}(id=${project.id})}"
                   class="btn btn-warning btn-sm me-2">
                    Edit
                </a>

                <a th:href="@{/delete-project/{id}(id=${project.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this project?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
